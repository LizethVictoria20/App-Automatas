name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Prefer reproducible installs when a lockfile exists
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          # Workaround for npm optionalDependencies/native bindings issues (Tailwind oxide)
          node -e "require('@tailwindcss/oxide')" >/dev/null 2>&1 || (
            echo "Reinstalling dependencies due to optional deps/native binding issue...";
            rm -rf node_modules package-lock.json;
            npm install --include=optional
          )

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
